<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>
</head>
<body>
<div th:if="${param.error != null}" th:text="${param.error}"></div>
<div th:if="${param.success != null}" th:text="${param.success}"></div>

<h1 th:text="${titulo}"></h1>
<a th:href="@{/productos/form}">Nuevo</a>

<table>
    <thead>
    <tr>
        <th>id</th>
        <th>nombre</th>
        <th>precio</th>
        <th>fecha</th>
        <th>categoria</th>
        <th>Editar</th>
        <th>Eliminar</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="producto: ${productos}">
        <td th:text="${producto.id}"></td>
        <td th:text="${producto.nombre}"></td>
        <td th:text="${producto.precio}"></td>
        <td th:text="${producto.createAt}"></td>
        <td th:text="${producto.categoria.nombre}"></td>
        <td><a th:href="@{/productos/form-v2/} + ${producto.id}">Editar</a></td>
        <td><a th:href="@{/productos/eliminar/} + ${producto.id}"
               onclick="return confirm('Está seguro que desea eliminar?')">Eliminar</a></td>
    </tr>
    </tbody>
</table>

</body>
</html>
